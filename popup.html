<!DOCTYPE html>
<html>
<head>
    <title>Ekachitta Settings</title>
    <style>
        body { width: 320px; font-family: sans-serif; padding: 10px; }
        h3 { color: #cc0000; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        textarea { width: 95%; height: 80px; padding: 5px; margin-bottom: 10px; resize: vertical; border: 1px solid #ccc; border-radius: 4px;}
        button { padding: 8px 15px; background-color: #cc0000; color: white; border: none; cursor: pointer; border-radius: 4px; margin-top: 5px; }
        button:hover { background-color: #a30000; }
        .section { margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;}
        .toggle-status { display: flex; align-items: center; }
        #status { font-weight: bold; margin-left: 10px; }
        .info-note { font-size: 12px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h3>Ekachitta: Focus Settings</h3>

    <div class="toggle-status section">
        <label for="toggleFilter">Filter Status:</label>
        <input type="checkbox" id="toggleFilter"> 
        <span id="status"></span>
    </div>
    <div class="toggle-status section">
        <label for="toggleShorts">Disable Shorts:</label>
        <input type="checkbox" id="toggleShorts"> 
        <span id="shortsstatus"></span>
    </div>
    <div class="toggle-status section">
        <label for="toggleComments">Disable Comments:</label>
        <input type="checkbox" id="toggleComments"> 
        <span id="commentsstatus"></span>
    </div>
    <div class="toggle-status section">
        <label for="toggleHyperFocus">Hyper Focus:</label>
        <input type="checkbox" id="toggleHyperFocus"> 
        <span id="hyperfocusstatus"></span>
    </div>


    <div class="section">
        <label for="keywords">Keywords (one per line):</label>
        <div class="info-note">Only videos matching these terms will be shown.</div>
        <textarea id="keywords" placeholder="e.g., Coding Tutorial &#10;Physics Lecture&#10;Documentary"></textarea>
        <button id="saveKeywordsButton">Save Keywords</button>
    </div>

    <div class="section">
        <label for="whitelist">Whitelist Channels (one name per line):</label>
        <div class="info-note">Videos from these channels are **always** allowed.</div>
        <textarea id="whitelist" placeholder="e.g., FreeCodeCamp&#10;NASA&#10;Veritasium"></textarea>
        <button id="saveWhitelistButton">Save Whitelist</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
